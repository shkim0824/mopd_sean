# OPD law top16 v2: = v1 + mask_truncated_completions=true + save every 25 (cap 16k unchanged). v1 collapsed into 'Final.' loops at step 72-84.
model:
  student: models/Qwen3-4B-OT3
  dtype: float32
teachers:
  endpoints_file: ""                   # written by scripts/opd.sbatch (mopd.distill.placement)
  top_k: 16
  max_workers: 64
  timeout: 900
data:
  paths:
    law: data/rl_pools/law_rl_v2_train.jsonl
  max_rows_per_domain: null
  seed: 42
  thinking: true
distill:
  mode: topk                          # pg (Eq. 3-4, A_max clip) | topk (Eq. 5 over teacher top-k)
  a_max: 5.0
  task_reward_coef: 0.0
  log_task_reward: false
train:
  lr: 1.0e-6
  batch_size: 32                       # 32 prompts x G=1 per optimizer step
  num_generations: 1
  max_completion_length: 16384         # same cap as v1 (user); runaway samples are masked instead
  max_steps: 200
  per_device_bs: 1
  temperature: 1.0
  top_p: 1.0
  beta: 0.0
  scheduler: constant
  warmup_ratio: 0.05
  max_grad_norm: 1.0
  save_steps: 25                       # v2: finer ckpts to catch the best pre-collapse point
  save_total_limit: null               # keep ALL checkpoints
  logging_steps: 1
  vllm_gpu_memory_utilization: 0.25
  vllm_tp: 1
  vllm_is_mode: token_truncate
  ddp_timeout: 7200
  mask_truncated_completions: true      # v2: drop truncated (runaway) samples from the loss
  output: outputs/opd/law-top16-v2
