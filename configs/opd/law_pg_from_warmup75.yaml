# OPD (law, pg) from the SFT warm-up checkpoint outputs/sft/sft_warmup_law/checkpoint-75 (otherwise identical to opd_law_pg.yaml)
model:
  student: outputs/sft/sft_warmup_law/checkpoint-75
  dtype: float32
teachers:
  endpoints_file: ""                   # written by scripts/opd.sbatch (mopd.distill.placement)
  top_k: 0
  max_workers: 64
  timeout: 900
data:
  paths:
    law: data/rl_pools/law_rl_v2_train.jsonl
  max_rows_per_domain: null
  seed: 42
  thinking: true
distill:
  mode: pg                          # pg (Eq. 3-4, A_max clip) | topk (Eq. 5 over teacher top-k)
  a_max: 5.0
  task_reward_coef: 0.0
  log_task_reward: false
train:
  lr: 1.0e-6
  batch_size: 32                       # 32 prompts x G=1 per optimizer step
  num_generations: 1
  max_completion_length: 16384         # = the teachers' RL rollout cap
  max_steps: 200
  per_device_bs: 1
  temperature: 1.0
  top_p: 1.0
  beta: 0.0
  scheduler: constant
  warmup_ratio: 0.05
  max_grad_norm: 1.0
  save_steps: 50                       # full trainer state (resume); 4 ckpts x ~55 GB per run (share is 99% full)
  save_total_limit: null               # keep ALL checkpoints
  logging_steps: 1
  vllm_gpu_memory_utilization: 0.25
  vllm_tp: 1
  vllm_is_mode: token_truncate
  ddp_timeout: 7200
  mask_truncated_completions: false
  output: outputs/opd/law-pg-sftw75
