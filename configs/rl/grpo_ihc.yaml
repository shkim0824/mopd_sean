# SAFETY teacher GRPO (IH-Challenge, recipe lena/VerIH/RLVR/RECIPES.md §2): ONE ROUND of the online alternating loop.
# scripts/rl_ihc_loop.sh runs 5 rounds x 40 steps = 200 steps (the other domain teachers' budget); every round
# re-synthesises the attacks against the current defender (self-play attacker), re-initialises the optimizer and
# starts from the previous round's weights (recipe: resume_mode=disable). Overridden per round by the driver:
#   policy.model_name, data.train.data_path, checkpointing.checkpoint_dir, logger.log_dir
# Recipe HPs kept: 128 prompts x 4 rollouts per step, lr 1e-6 constant (no warmup), KL 0.001 to the round init,
# T=1.0 rollouts, binary grader reward, no <think> gate. Response budget 8192 (recipe 2048 assumed a short-thinking Qwen3-8B).
defaults: /opt/nemo-rl/examples/configs/grpo_math_1B.yaml

grpo:
  num_prompts_per_step: 128
  num_generations_per_prompt: 4
  max_num_epochs: 100                # the step cap governs (40 steps x 128 prompts ~ 4.2 passes over a 1,212-skeleton round)
  max_num_steps: 40
  normalize_rewards: true
  use_leave_one_out_baseline: true
  val_period: 20
  val_at_start: true
  max_val_samples: 100
  val_batch_size: 100
  overlong_filtering: false
  advantage_clip_low: -20
  advantage_clip_high: 20
  use_dynamic_sampling: false
  reward_shaping:
    enabled: false

loss_fn:
  reference_policy_kl_penalty: 0.001    # recipe kl_loss_coef 0.001 (low-variance KL to the round's init policy)
  ratio_clip_min: 0.2
  ratio_clip_max: 0.28
  use_importance_sampling_correction: true
  truncated_importance_sampling_type: "tis"
  truncated_importance_sampling_ratio: 5
  truncated_importance_sampling_ratio_min: 0.2
  sequence_level_importance_ratios: false
  token_level_loss: true

checkpointing:
  enabled: true
  checkpoint_dir: "/mnt/datafs/ib-a100-cluster-a-pri/lmalign/personal/sean/mopd_sean/outputs/rl/grpo_ihc_4b/r0"
  metric_name: "val:accuracy"
  higher_is_better: true
  keep_top_k: 1000
  save_period: 20
  model_save_format: "safetensors"
  save_consolidated: true

policy:
  model_name: "/mnt/datafs/ib-a100-cluster-a-pri/lmalign/personal/sean/mopd_sean/models/Qwen3-4B-OT3"
  tokenizer:
    name: ${policy.model_name}
  train_global_batch_size: 512       # 128 prompts x 4 rollouts: one optimizer update per GRPO step
  train_micro_batch_size: 1
  logprob_batch_size: 2
  max_total_sequence_length: 10240   # prompt <= 2048 + response <= 8192 (recipe: 2048/2048 for Qwen3-8B; OT3 thinks long)
  precision: "bfloat16"
  dtensor_cfg:
    enabled: true
    activation_checkpointing: true
    tensor_parallel_size: 1
    context_parallel_size: 1
    env_vars:
      PYTORCH_CUDA_ALLOC_CONF: "max_split_size_mb:512"
  optimizer:
    name: "torch.optim.AdamW"
    kwargs:
      lr: 1.0e-6
      weight_decay: 0.0
      betas: [0.9, 0.999]
      eps: 1e-8
  scheduler:                         # NeMo-RL expects the LinearLR + ConstantLR + milestones triple; start_factor 1.0 = no warmup (recipe: constant lr)
    - name: "torch.optim.lr_scheduler.LinearLR"
      kwargs:
        start_factor: 1.0
        end_factor: 1.0
        total_iters: 1
    - name: "torch.optim.lr_scheduler.ConstantLR"
      kwargs:
        factor: 1.0
        total_iters: 10000000000
    - milestones: [1]
  generation:
    backend: "vllm"
    max_new_tokens: 8192
    temperature: 1.0
    top_p: 1.0
    top_k: null
    vllm_cfg:
      tensor_parallel_size: 1
      gpu_memory_utilization: 0.6
      max_model_len: ${policy.max_total_sequence_length}
      enforce_eager: false

data:
  max_input_seq_length: 2048
  shuffle: true
  train:
    dataset_name: ResponseDataset
    data_path: "/mnt/datafs/ib-a100-cluster-a-pri/lmalign/personal/sean/mopd_sean/data/rl_pools/ihc_4b_r0.jsonl"
    split_validation_size: 0
    processor: "mopd_ihc_processor"
    env_name: "mopd_ihc"
  validation:
    dataset_name: ResponseDataset
    data_path: "/mnt/datafs/ib-a100-cluster-a-pri/lmalign/personal/sean/mopd_sean/data/domains/ih-challenge/heldout_attacks_ot3-4b.jsonl"
    processor: "mopd_ihc_processor"
    env_name: "mopd_ihc"
  default:
    prompt_file: null
    system_prompt_file: null

env:
  mopd_ihc:
    num_workers: 8
    timeout: 5.0

logger:
  log_dir: "/mnt/datafs/ib-a100-cluster-a-pri/lmalign/personal/sean/mopd_sean/logs/nemo/grpo_ihc_4b_r0"
  tensorboard_enabled: true

cluster:
  gpus_per_node: 8
  num_nodes: 4
