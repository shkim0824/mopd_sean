# Late re-merge ablation (user 2026-09-17 21:50, clarified 22:00): init = mopd-4dom-128-merged-lawsft/checkpoint-200 (the phase-2 UNIFORM-merge 4-domain MOPD
# after 200 steps) + 0.3 x TASK VECTOR of the medical teacher (teacher-med minus Qwen3-4B-OT3; merge_teachers --mode task_arithmetic), then 50 more steps of the SAME 4-domain PG MOPD (128/upd, 32 per domain,
# lr 1e-6, 2 nodes = 1 student + 1 teacher node). Question: can the merge ratio be raised later? Otherwise = 4dom_pg128_merged_lawsft.yaml.
model:
  student: models/merged-4dom-uniformck200-medtv03
  dtype: float32
teachers:
  endpoints_file: ""                   # written by scripts/opd.sbatch (mopd.distill.placement)
  top_k: 64
  max_workers: 64
  timeout: 900
data:
  paths:
    law: data/rl_pools/law_rl_v2_train.jsonl
    fin: data/rl_pools/fin_train.jsonl
    if: data/rl_pools/if_train.jsonl
    med: data/rl_pools/med_sftp_train.jsonl
  max_rows_per_domain: null
  seed: 42
  thinking: true
  per_domain_per_batch: 32
distill:
  mode: pg
  a_max: 5.0
  task_reward_coef: 0.0
  log_task_reward: false
train:
  lr: 1.0e-6
  batch_size: 128
  num_generations: 1
  max_completion_length: 16384
  max_steps: 50
  per_device_bs: 1
  temperature: 1.0
  top_p: 1.0
  beta: 0.0
  scheduler: constant
  warmup_ratio: 0.05
  max_grad_norm: 1.0
  save_steps: 25
  save_total_limit: null
  logging_steps: 1
  vllm_gpu_memory_utilization: 0.25
  vllm_tp: 1
  vllm_is_mode: token_truncate
  ddp_timeout: 7200
  mask_truncated_completions: false
  output: outputs/opd/mopd-4dom-128-uniformck200-medtv03-50
