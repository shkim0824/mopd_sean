# PHASE 4 (fork session) 2026-09-20: TAU-ONLY control for run B. Same init (models/p4-merged-5teachers-ns85223)
# and same schedule (+0.3 tau after steps 50/100/150), but med/law/if are dropped from the increment, so run B
# itself is the direct control (only the merge content differs).
# Why: measured task-vector norms are med 11.58 / tau 3.66 / law 2.81 / fin 0.98 / if 0.92 (34-tensor sample,
# pairwise |cos| <= 0.19). In B's increment med carried 51% of the squared perturbation while buying at most
# +2.4 MedQA (paired CI +-2.3); tau carried 46% and bought tau2 +15 to +23. This arm pays only for tau.
# PHASE 4 (fork session) in-training merge arm: 8-5223 (tau 0.8, med 0.5, law 0.2, fin 0.2, if 0.3) init; every 50 steps += med 0.1, law 0.1, tau 0.3, if 0.1
# = configs/mopd/5dom_pg128_merged_tau10.yaml with student/output changed; launched by tmp/phase4/inmerge/opd_inmerge.sbatch
model:
  student: models/p4-merged-5teachers-ns85223
  dtype: float32
teachers:
  endpoints_file: ''
  top_k: 64
  max_workers: 64
  timeout: 900
data:
  paths:
    tau: data/rl_pools/tau_opd_train.jsonl
    med: data/rl_pools/med_sftp_train.jsonl
    law: data/rl_pools/law_rl_v2_train.jsonl
    fin: data/rl_pools/fin_train.jsonl
    if: data/rl_pools/if_train.jsonl
  max_rows_per_domain: null
  seed: 42
  thinking: true
  per_domain_per_batch: equal
  max_prompt_tokens: 15872
distill:
  mode: pg
  a_max: 5.0
  task_reward_coef: 0.0
  log_task_reward: false
train:
  lr: 1.0e-06
  batch_size: 128
  num_generations: 1
  max_completion_length: 16384
  max_steps: 200
  per_device_bs: 1
  temperature: 1.0
  top_p: 1.0
  beta: 0.0
  scheduler: constant
  warmup_ratio: 0.05
  max_grad_norm: 1.0
  save_steps: 25
  save_total_limit: null
  logging_steps: 1
  vllm_gpu_memory_utilization: 0.25
  vllm_tp: 1
  vllm_is_mode: token_truncate
  ddp_timeout: 7200
  mask_truncated_completions: true
  output: outputs/opd/p4-mopd-5dom-ns85223-im50-tauonly-t3
