# 4-domain MOPD, OT3 init (NO merge), SFT-only law teacher, WITH the v2 truncation mask
# (user 2026-09-17): = 4dom_pg128_lawsft.yaml + mask_truncated_completions=true.
# Why: every configs/mopd/*.yaml has the mask off, so the v2 fix was never applied to MOPD.
# The unmasked run's training clip fraction went 0.016 (s125) -> 0.336 (s150) -> 0.484 (s200)
# and its CaseHOLD/MedQA evals are 99%/94% truncated. 0.48 is the partial regime where the
# mask rescued law-top64 (0.500 at step 75 -> 0.000 by step 100 -> best law OPD, 75.4);
# it is NOT the total regime where masking leaves an empty batch (top16-v2 / pg-lawsft, ~1.0).
# 128 prompts / update = 32 prompts of EVERY domain per batch (balanced, sequential), G=1, 200 steps.
model:
  student: models/Qwen3-4B-OT3
  dtype: float32
teachers:
  endpoints_file: ""                   # written by scripts/opd.sbatch (mopd.distill.placement)
  top_k: 64
  max_workers: 64
  timeout: 900
data:
  paths:
    law: data/rl_pools/law_rl_v2_train.jsonl
    fin: data/rl_pools/fin_train.jsonl
    if: data/rl_pools/if_train.jsonl
    med: data/rl_pools/med_sftp_train.jsonl
  max_rows_per_domain: null
  seed: 42
  thinking: true
  per_domain_per_batch: 32
distill:
  mode: pg
  a_max: 5.0
  task_reward_coef: 0.0
  log_task_reward: false
train:
  lr: 1.0e-6
  batch_size: 128
  num_generations: 1
  max_completion_length: 16384
  max_steps: 200
  per_device_bs: 1
  temperature: 1.0
  top_p: 1.0
  beta: 0.0
  scheduler: constant
  warmup_ratio: 0.05
  max_grad_norm: 1.0
  save_steps: 25
  save_total_limit: null
  logging_steps: 1
  vllm_gpu_memory_utilization: 0.25
  vllm_tp: 1
  vllm_is_mode: token_truncate
  ddp_timeout: 7200
  mask_truncated_completions: true
  output: outputs/opd/mopd-4dom-128-lawsft-masked
