# PHASE 4 (fork session) 2026-09-23: ramp03 with the step-50 merge swapped med -> if.
# plan = 25@tau.3,med.3,law.3 (inherited) + 50@tau.3,if.3 + 75@tau.3, nothing after.
# PHASE 4 (fork session) 2026-09-21: branch of the main session's mopd-5dom-128-sean-merged-uniform at checkpoint-25, with a
# tapering in-training merge schedule. plan=25@tau=0.3,med=0.3,law=0.3+50@tau=0.3,med=0.3+75@tau=0.3+100@tau=0.3
# The first 25 steps are shared with the control by construction (same weights), not merely the same seed.
# 5-domain MOPD, SEAN tau2 teacher, uniform 5-teacher merge init (0.2 each, task arithmetic).
model:
  student: models/merged-5teachers-sean-uniform
  dtype: float32
teachers:
  endpoints_file: ''
  top_k: 64
  max_workers: 64
  timeout: 900
data:
  paths:
    tau: data/rl_pools/tau_opd_train.jsonl
    med: data/rl_pools/med_sftp_train.jsonl
    law: data/rl_pools/law_rl_v2_train.jsonl
    fin: data/rl_pools/fin_train.jsonl
    if: data/rl_pools/if_train.jsonl
  max_rows_per_domain: null
  seed: 42
  thinking: true
  per_domain_per_batch: equal
  max_prompt_tokens: 15872
distill:
  mode: pg
  a_max: 5.0
  task_reward_coef: 0.0
  log_task_reward: false
train:
  lr: 1.0e-06
  batch_size: 128
  num_generations: 1
  max_completion_length: 16384
  max_steps: 200
  per_device_bs: 1
  temperature: 1.0
  top_p: 1.0
  beta: 0.0
  scheduler: constant
  warmup_ratio: 0.05
  max_grad_norm: 1.0
  save_steps: 25
  save_total_limit: null
  logging_steps: 1
  vllm_gpu_memory_utilization: 0.25
  vllm_tp: 1
  vllm_is_mode: token_truncate
  ddp_timeout: 7200
  mask_truncated_completions: true
  output: outputs/opd/p4-mopd-5dom-sean-uni-b25-ramp03-if50
