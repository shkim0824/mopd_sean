# 1.7B 30/30/30 under the gain-invariant transfer (tmp/solve30_1p7b.py H2): law 20 / med 100 / tau 65 M. Companion of s13a_1p7b (same tokens as 4B s13a).
# warm-up mix s13b_1p7b (user 2026-09-21): law 20.0M + med 100.0M + tau2 65.0M tokens
# = 185.0M tokens = 180 steps x 32 packed 32k bins. MOPD validation rows excluded.
# block-style YAML (cfgval.py is line-based).
model:
  base: models/Qwen3-1.7B-OT3
  attn: auto
data:
  sources:
    math: null
    code: null
    if: null
    mix: data/sft_warmup/wu_mix_s13b_1p7b.jsonl
  cache_dir: null
  weights: null
  max_rows: null
  max_len: 32768
  thinking: true
  packing: flatten
  seed: 42
train:
  output: outputs/sft/wu_mix_s13b_1p7b
  epochs: 100.0
  max_steps: 180
  lr: 1.0e-05
  scheduler: cosine
  warmup_ratio: 0.05
  weight_decay: 0.0
  max_grad_norm: 1.0
  per_device_bs: 1
  grad_accum: 4
  liger: true
  grad_ckpt: true
  logging_steps: 1
  save_strategy: steps
  save_steps: 45
  save_total_limit: null
  save_only_model: true
  resume: auto
  seed: 42
  dataloader_workers: 2
