# med distill SFT of Qwen3-4B-OT3, same c6 traces (data/sft_distill_v3/c6_45opt_k3.jsonl, 40,853 rows).
# ARM (1) of the 2026-09-16 batch/packing test: buy Sigma(lr) with STEPS instead of lr.
#   lr 1e-5 -> 5e-7 floor (cosine_with_min_lr, min_lr_rate 0.05), warmup 5%
#   packing=flatten @ 32k, effective batch 32 bins/step = 4 nodes x 8 GPU x pd 1 x grad_accum 1
#   2 epochs -> 3,270 bins / 32 = 103 steps/epoch = 206 steps, ~1.04M tok/step
# Sigma(lr) = 206 x 5.25e-6 = 1.08e-3, i.e. THE SAME budget as the lr 2e-5 / batch 64 / 104-step arm
# (1.07e-3) but with half the batch, double the steps and half the lr -> isolates steps vs lr.
model:
  base: models/Qwen3-4B-OT3
  attn: auto
data:
  sources: {med: data/sft_distill_v3/c6_45opt_k3.jsonl}
  cache_dir: null
  weights: null
  max_rows: null
  max_len: 32768
  thinking: true
  packing: flatten
  seed: 42
train:
  output: outputs/sft/sft_distill_med_c6_lr1e5_32k_b32_2ep
  epochs: 2.0
  lr: 1.0e-5
  scheduler: cosine_with_min_lr
  scheduler_kwargs: {min_lr_rate: 0.05}
  warmup_ratio: 0.05
  weight_decay: 0.0
  max_grad_norm: 1.0
  per_device_bs: 1
  grad_accum: 1
  liger: true
  grad_ckpt: true
  logging_steps: 5
  save_strategy: epoch
  save_steps: 0
  save_total_limit: null
  save_only_model: false
  resume: auto
  seed: 42
  dataloader_workers: 2
