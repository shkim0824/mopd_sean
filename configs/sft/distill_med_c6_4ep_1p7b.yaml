# 1.7B teacher (user 2026-09-14): = configs/sft/distill_med_c6_4ep.yaml with base Qwen3-1.7B-OT3 (same data, epochs, lr, max_len)
# select_traces (min-enum, shortest, cap). 2-node pd1, max_len 8192, lr 1e-5, 2 epochs, save each epoch.
model:
  base: models/Qwen3-1.7B-OT3
  attn: auto
data:
  sources: {med: data/sft_distill_v3/c6_45opt_k3.jsonl}
  cache_dir: null
  weights: null
  max_rows: null
  max_len: 8192
  thinking: true
  packing: flatten
  seed: 42
train:
  output: outputs/sft/sft_distill_med_c6_4ep_1p7b
  epochs: 4.0
  lr: 1.0e-5
  scheduler: cosine
  warmup_ratio: 0.05
  weight_decay: 0.0
  max_grad_norm: 1.0
  per_device_bs: 1
  grad_accum: 1
  liger: true
  grad_ckpt: true
  logging_steps: 5
  save_strategy: epoch
  save_steps: 0
  save_total_limit: null
  save_only_model: false
  resume: auto
  seed: 42
  dataloader_workers: 2
