# PHASE 2 (user 2026-09-15): off-policy SFT distillation warm-up (law) from the SFT-ONLY law teacher (models/teacher-law-sft):
# OT3 student <- 6,400 rejection-sampled teacher trajectories on the law OPD pool prompts (k=1 at T=1.0, letter-exact filter;
# outputs/teacher_gen/gen-lawsft-teacher-k1 -> data/sft_warmup/lawsft_sft6400.jsonl). Same recipe as warmup_law.yaml:
# 200 steps x 32 sequences (1 node, per_device_bs 1 x grad_accum 4 x 8 GPUs), no packing, save every 25 steps (weights only).
model:
  base: models/Qwen3-4B-OT3
  attn: auto
data:
  sources: {math: null, code: null, if: null, law: data/sft_warmup/lawsft_sft6400.jsonl}   # null = drop the OT3 defaults
  cache_dir: null
  weights: null
  max_rows: null
  max_len: 20480
  thinking: true
  packing: none
  seed: 42
train:
  output: outputs/sft/sft_warmup_lawsft
  epochs: 1.0
  max_steps: 200
  lr: 1.0e-5
  scheduler: cosine
  warmup_ratio: 0.05
  weight_decay: 0.0
  max_grad_norm: 1.0
  per_device_bs: 1
  grad_accum: 4
  liger: true
  grad_ckpt: true
  logging_steps: 1
  save_strategy: steps
  save_steps: 25
  save_total_limit: null
  save_only_model: true
  resume: auto
  seed: 42
  dataloader_workers: 2
