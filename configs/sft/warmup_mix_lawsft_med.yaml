# PHASE 2 (user 2026-09-15): mixed law+med SFT warm-up with the SFT-ONLY law teacher's trajectories. Same construction as
# warmup_mix_lawmed.yaml: 3,200 rows sampled (seed 42) from lawsft_sft6400 (= law warm-up ck100 exposure) + med_sftp_k4_keep3 x2
# (= scaled-up B 2-epoch exposure), shuffled seed 42 -> data/sft_warmup/mix_lawsft3200_medB2ep.jsonl (52,002 rows), 1 epoch,
# teacher recipe (2 nodes, flatten packing 8192, lr 1e-5 cosine). Then 4-dom PG MOPD 128/upd from the checkpoint.
model:
  base: models/Qwen3-4B-OT3
  attn: auto
data:
  sources: {math: null, code: null, if: null, mix: data/sft_warmup/mix_lawsft3200_medB2ep.jsonl}   # null = drop the OT3 defaults
  cache_dir: null
  weights: null
  max_rows: null
  max_len: 8192
  thinking: true
  packing: flatten
  seed: 42
train:
  output: outputs/sft/sft_warmup_mix_lawsft_med
  epochs: 1.0
  max_steps: -1
  lr: 1.0e-5
  scheduler: cosine
  warmup_ratio: 0.05
  weight_decay: 0.0
  max_grad_norm: 1.0
  per_device_bs: 1
  grad_accum: 1
  liger: true
  grad_ckpt: true
  logging_steps: 1
  save_strategy: epoch
  save_total_limit: null
  save_only_model: true
  resume: auto
  seed: 42
  dataloader_workers: 2
